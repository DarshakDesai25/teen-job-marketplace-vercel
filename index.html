<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teen Job Marketplace Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --muted:#5B6478; --paper:#FBFCFE; --card:#FFFFFF; --line:#D9E1EC;
  --harbor:#16325C; --teal:#1F8A7E; --teal-soft:#E3F3F1; --sun:#FFD166; --sun-soft:#FFF6DC;
  --red:#B42318; --red-soft:#FDECEA; --green:#2E7D32; --green-soft:#E6F4EA;
  --display:"Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8EDF5; --muted:#A3AEC2; --paper:#0F1726; --card:#172235; --line:#2A3850;
    --harbor:#9FC3F5; --teal:#4CC2B3; --teal-soft:#16332F; --sun:#FFD166; --sun-soft:#3A3220;
    --red:#FF8A80; --red-soft:#3A1E1E; --green:#7BD389; --green-soft:#1B3322; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EDF5; --muted:#A3AEC2; --paper:#0F1726; --card:#172235; --line:#2A3850;
  --harbor:#9FC3F5; --teal:#4CC2B3; --teal-soft:#16332F; --sun:#FFD166; --sun-soft:#3A3220;
  --red:#FF8A80; --red-soft:#3A1E1E; --green:#7BD389; --green-soft:#1B3322; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.12rem;font-weight:600}
p{margin:0 0 .8em}
a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header.top{background:var(--harbor);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
:root[data-theme="dark"] header.top{background:#0B2240}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0B2240}}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .tag{width:34px;height:34px;border-radius:9px;background:var(--sun);color:#16325C;display:grid;place-items:center;font-size:1.05rem}
.roles{display:flex;gap:6px;background:rgba(255,255,255,.1);padding:4px;border-radius:12px}
.roles button{border:0;background:transparent;color:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700}
.roles button[aria-pressed="true"]{background:var(--sun);color:#16325C}
.sub{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px}
.sub button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.sub button[aria-current="page"]{background:#fff;color:#16325C;border-color:#fff;font-weight:700}
main{padding:28px 0 60px}
.lede{color:var(--muted);max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack>*+*{margin-top:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
label.f{display:block;font-weight:700;margin-bottom:6px}
.hint{color:var(--muted);font-size:.92rem;font-weight:400}
input[type=text],input[type=email],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-block;padding:7px 13px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper)}
.chip input:checked+span{background:var(--teal-soft);border-color:var(--teal);font-weight:700}
.chip input:focus-visible+span{outline:3px solid var(--sun);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--red);color:#fff}
.btn.sun{background:var(--sun);color:#16325C}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.badge.wait{background:var(--sun-soft);color:#8A5A00}
:root[data-theme="dark"] .badge.wait{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.wait{color:var(--sun)}}
.badge.bad{background:var(--red-soft);color:var(--red)}
.badge.neutral{background:var(--teal-soft);color:var(--teal)}
.job{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:start}
.job .pay{font-family:var(--display);font-weight:800;font-size:1.3rem;text-align:right;white-space:nowrap}
.job .meta{color:var(--muted);font-size:.95rem}
.why{font-size:.92rem;color:var(--teal);font-weight:700}
.note{border-left:5px solid var(--sun);background:var(--sun-soft);padding:12px 14px;border-radius:0 10px 10px 0}
.note.ok{border-color:var(--green);background:var(--green-soft)}
.note.bad{border-color:var(--red);background:var(--red-soft)}
.hidden-jobs{color:var(--muted);font-size:.95rem}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.steps li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--harbor);color:#fff;font-weight:700;font-size:.9rem}
:root[data-theme="dark"] .steps li::before{color:#0F1726}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .steps li::before{color:#0F1726}}
.steps li.done::before{content:"\2713";background:var(--green)}
.thread{border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto;background:var(--paper)}
.msg{padding:6px 10px;border-radius:10px;margin:4px 0;max-width:85%}
.msg.me{background:var(--teal-soft);margin-left:auto}
.msg.them{background:var(--card);border:1px solid var(--line)}
.msg small{display:block;color:var(--muted);font-size:.78rem}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;margin-bottom:26px}
.hero .shift{background:var(--harbor);color:#fff;border-radius:16px;padding:20px;transform:rotate(-1.5deg);box-shadow:8px 8px 0 var(--sun)}
.hero .shift h3{color:var(--sun);margin-bottom:.2em}
.hero .shift dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.hero .shift dt{opacity:.75}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero .shift{transform:none}}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale label{position:relative}
.scale input{position:absolute;opacity:0;inset:0}
.scale span{display:grid;place-items:center;width:46px;height:46px;border:1.5px solid var(--line);border-radius:10px;font-weight:700;background:var(--paper);cursor:pointer}
.scale input:checked+span{background:var(--harbor);color:#fff;border-color:var(--harbor)}
:root[data-theme="dark"] .scale input:checked+span{color:#0F1726}
.scale input:focus-visible+span{outline:3px solid var(--sun);outline-offset:2px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,40,.55)}
dialog .in{padding:22px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;font-weight:700;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.demo{font-size:.85rem;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:18px 0 30px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
/* ---------- visual refresh v2 ---------- */
body{background:var(--paper);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
main{padding-top:34px}
header.top{box-shadow:0 4px 0 var(--sun)}
.brand{color:#fff;text-decoration:none;line-height:1.05}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.78rem;opacity:.75}
.brand .tag{width:38px;height:38px;border-radius:11px;transform:rotate(-6deg)}
.sub[hidden]{display:none}
.card{box-shadow:0 1px 0 var(--line),0 14px 28px -22px rgba(22,50,92,.45);border-radius:18px}
.btn{box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{box-shadow:0 3px 0 var(--line);background:var(--card)}
.btn.big{padding:15px 24px;font-size:1.06rem;border-radius:12px}
.kicker{display:inline-block;background:var(--teal-soft);color:var(--teal);font-weight:700;font-size:.9rem;padding:5px 12px;border-radius:999px;margin-bottom:14px}
.mega{font-size:clamp(2.4rem,6.4vw,4.3rem);font-weight:800;letter-spacing:-.025em;line-height:1.02;margin-bottom:.35em}
.h-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;align-items:center;padding:18px 0 38px}
.h-hero .lede{font-size:1.15rem;margin-bottom:22px}
.tickets{position:relative;height:420px}
.tickets::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:var(--sun);left:50%;top:50%;transform:translate(-50%,-50%)}
.ticket{position:absolute;left:8%;right:4%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 18px 30px -18px rgba(22,50,92,.55)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--paper);border:1px solid var(--line);transform:translateY(-50%)}
.ticket::before{left:-12px;clip-path:inset(0 0 0 50%)}.ticket::after{right:-12px;clip-path:inset(0 50% 0 0)}
.ticket .tk-top{display:flex;gap:12px;align-items:center}
.ticket b{display:block;font-family:var(--display);font-size:1.15rem}
.ticket .tk-top span:not(.cat){color:var(--muted);font-size:.92rem}
.ticket .tk-pay{font-family:var(--display);font-weight:800;font-size:1.25rem;margin-left:auto}
.ticket.t3{top:18px;left:16%;right:0;transform:rotate(5deg);display:flex;align-items:center}
.ticket.t2{top:112px;left:2%;right:10%;transform:rotate(-4deg);display:flex;align-items:center}
.ticket.t1{top:206px;transform:rotate(1.5deg);border:2px solid var(--harbor);padding:20px 22px}
.tk-row{display:flex;gap:16px;margin:14px 0 12px;padding:10px 0;border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);font-weight:700}
.tk-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.ticket.t1{animation:drop .7s cubic-bezier(.2,.9,.3,1.3) both .15s}@keyframes drop{from{transform:translateY(-40px) rotate(-8deg);opacity:0}}}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:8px 0 40px}
.trust>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.trust .ti{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--harbor);color:var(--sun);font-size:1.2rem;font-weight:700;margin-bottom:10px}
.trust b{font-family:var(--display);font-size:1.1rem}.trust p{color:var(--muted);margin:.3em 0 0}
.how{margin-bottom:40px}
.flow{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:f}
.flow li{counter-increment:f;position:relative;padding-top:52px}
.flow li::before{content:counter(f);position:absolute;top:0;left:0;width:40px;height:40px;border-radius:50%;background:var(--sun);color:#16325C;font-family:var(--display);font-weight:800;display:grid;place-items:center;font-size:1.1rem;z-index:1}
.flow li:not(:last-child)::after{content:"";position:absolute;top:19px;left:48px;right:-6px;border-top:3px dotted var(--teal)}
.flow b{display:block;font-family:var(--display);font-size:1.08rem}.flow span{color:var(--muted)}
.doors{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:16px;margin-bottom:24px}
.door{text-align:left;border:0;border-radius:20px;padding:24px;cursor:pointer;color:#fff;min-height:190px;display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.door:hover{transform:translateY(-3px)}
.door.teen{background:var(--teal)}.door.biz{background:#16325C}.door.fb{background:var(--sun);color:#16325C}
.door .d-k{font-weight:700;opacity:.85}.door b{font-family:var(--display);font-size:1.45rem;line-height:1.15}
.door .d-go{margin-top:auto;font-weight:700;text-decoration:underline;text-underline-offset:4px}
.stepper{list-style:none;display:flex;gap:0;margin:0 0 22px;padding:0;max-width:560px}
.stepper li{flex:1;text-align:center;font-size:.85rem;color:var(--muted);position:relative;padding-top:26px}
.stepper li::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--line);z-index:1}
.stepper li::after{content:"";position:absolute;top:13px;left:-50%;width:100%;border-top:3px solid var(--line)}
.stepper li:first-child::after{display:none}
.stepper li.done::before{background:var(--teal);border-color:var(--teal)}.stepper li.done::after,.stepper li.now::after{border-color:var(--teal)}
.stepper li.now{color:var(--ink);font-weight:700}.stepper li.now::before{border-color:var(--teal);background:var(--sun)}
.cat{display:inline-grid;place-items:center;flex:0 0 auto;border-radius:14px;background:var(--cc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.cat svg{width:56%;height:56%}
.jobc{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;transition:transform .12s,box-shadow .12s}
.jobc:hover{transform:translateY(-2px);box-shadow:0 1px 0 var(--line),0 20px 30px -20px rgba(22,50,92,.55)}
.jobc h3{font-size:1.25rem;margin:0}
.jc-biz{margin:2px 0}
.jc-side{text-align:right;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.pay small{display:block;font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
.jobc .pay{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1}
.times{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.times span{font-size:.82rem;font-weight:700;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.times .sum{background:var(--sun-soft);border-color:var(--sun)}
.why{margin-top:4px}
@media (max-width:640px){.jobc{grid-template-columns:auto 1fr}.jc-side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;text-align:left}}
.detail{position:relative;overflow:hidden;padding-top:34px}
.detail .d-band{position:absolute;left:0;right:0;top:0;height:12px;background:var(--cc)}
.celebrate{display:flex;gap:14px;align-items:center;background:linear-gradient(0deg,var(--green-soft),var(--green-soft));border:2px solid var(--green);border-radius:16px;padding:16px}
.celebrate>span{font-size:2.2rem}.celebrate p{margin:.2em 0 0}
.bizhero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;margin-bottom:24px}
.perks{list-style:none;margin:0;padding:20px;background:#16325C;color:#fff;border-radius:18px;box-shadow:8px 8px 0 var(--sun)}
.perks li{padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.25)}.perks li:last-child{border:0}
.perks b{font-family:var(--display);font-size:1.4rem;color:var(--sun);margin-right:6px}
h1{letter-spacing:-.02em}
@media (max-width:820px){.h-hero,.bizhero{grid-template-columns:1fr}.tickets{height:400px;max-width:460px}.trust,.doors{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.flow li:nth-child(2)::after{display:none}}
@media (max-width:820px){.ticket.t3{right:5%;transform:rotate(3deg)}.ticket.t2{right:12%;transform:rotate(-2deg)}.ticket.t1{right:3%;left:4%}}
@media (max-width:480px){.flow{grid-template-columns:1fr}.flow li::after{display:none}.roles button{padding:7px 10px;font-size:.92rem}}
</style>
<style>

 --harbor:#2451B7;--teal:#2451B7;--teal-soft:#EAF0FC;--sun:#C6F432;--sun-soft:#F3FBDD;

 --harbor:#7FA6FF;--teal:#7FA6FF;--teal-soft:#1A2744;--sun:#C6F432;--sun-soft:#26301A;--green:#6EE7A0;--green-soft:#14291E;--red:#FDBA8C;--red-soft:#33201A;--deep:#E6EBF5}}

:root[data-theme="dark"] .btn:not(.ghost):not(.sun){color:#0B1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.sun):not(.warn){color:#0B1220}}
.card{box-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -16px rgba(15,23,42,.25);border-radius:16px}

const SHEET_URL="";
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAYNAME={Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"};
const INTERESTS=["Retail","Food service","Pet care","Tutoring","Childcare","Events","Office help"];
const KEY="tjm_proto_v3";
const WINDOWS={no:["Not available",null],after:["After school, 3 to 7 pm",[15,19]],evening:["Evening, 5 to 10 pm",[17,22]],morning:["Morning, 7 am to 1 pm",[7,13]],all:["All day, 7 am to 10 pm",[7,22]]};
const HOODS={"Allston":[42.355,-71.132],"Back Bay":[42.350,-71.081],"Brighton":[42.348,-71.153],"Charlestown":[42.378,-71.061],"Dorchester":[42.300,-71.061],"East Boston":[42.375,-71.039],"Fenway":[42.343,-71.100],"Hyde Park":[42.255,-71.124],"Jamaica Plain":[42.310,-71.114],"Mattapan":[42.272,-71.092],"North End":[42.365,-71.054],"Roslindale":[42.283,-71.127],"Roxbury":[42.315,-71.090],"South Boston":[42.334,-71.048],"South End":[42.341,-71.074],"West Roxbury":[42.280,-71.160]};
function miles(a,b){const A=HOODS[a],B=HOODS[b];if(!A||!B)return 0;const r=x=>x*Math.PI/180;const dl=r(B[0]-A[0]),dn=r(B[1]-A[1]);const h=Math.sin(dl/2)**2+Math.cos(r(A[0]))*Math.cos(r(B[0]))*Math.sin(dn/2)**2;return Math.max(0.3,Math.round(3958.8*2*Math.asin(Math.sqrt(h))*10)/10);}
function jobMiles(j){return S.teen.hood?miles(S.teen.hood,j.hood):j.miles;}

/* ---------- youth labor rules ---------- */
function fmt(h){const hr=Math.floor(h),m=Math.round((h-hr)*60);const ap=hr>=12?"pm":"am";let h12=hr%12;if(h12===0)h12=12;return h12+(m?":"+String(m).padStart(2,"0"):"")+" "+ap;}
function len(sh){return sh.e-sh.s;}
function ruleCheck(age,job){
  const issues=[];const summer=job.season==="summer";
  const week=job.shifts.reduce((a,sh)=>a+len(sh),0);
  const daysWorked=new Set(job.shifts.map(s=>s.d)).size;
  if(age<job.minAge){issues.push("This employer needs workers who are at least "+job.minAge+".");return issues;}
  if(age<=15){
    job.shifts.forEach(sh=>{
      const school=!summer&&["Mon","Tue","Wed","Thu","Fri"].includes(sh.d);
      const dayMax=school?3:8;
      if(len(sh)>dayMax) issues.push(DAYNAME[sh.d]+" shift is "+len(sh)+" hours. The limit is "+dayMax+" hours on a "+(school?"school day":"day with no school")+".");
      if(sh.s<7) issues.push(DAYNAME[sh.d]+" shift starts before 7 am.");
      const late=summer?21:19;
      if(sh.e>late) issues.push(DAYNAME[sh.d]+" shift ends at "+fmt(sh.e)+". Workers ages 14 and 15 must stop by "+fmt(late)+(summer?" in summer.":" during the school year."));
    });
    const wkMax=summer?40:18;
    if(week>wkMax) issues.push("The job adds up to "+week+" hours a week. The limit is "+wkMax+" hours"+(summer?" in summer.":" in a school week."));
  } else {
    job.shifts.forEach(sh=>{
      if(len(sh)>9) issues.push(DAYNAME[sh.d]+" shift is longer than 9 hours.");
      if(sh.s<6) issues.push(DAYNAME[sh.d]+" shift starts before 6 am.");
      const schoolNight=!summer&&["Sun","Mon","Tue","Wed","Thu"].includes(sh.d);
      const late=schoolNight?22:23.5;
      if(sh.e>late) issues.push(DAYNAME[sh.d]+" shift ends after "+fmt(late)+".");
    });
    if(week>48) issues.push("The job adds up to more than 48 hours a week.");
  }
  if(daysWorked>6) issues.push("Workers under 18 can work at most 6 days a week.");
  return issues;
}
const CAT={"Retail":{c:"#E76F51",i:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0" fill="none" stroke="#fff" stroke-width="2"/>'},
"Food service":{c:"#D4A017",i:'<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16" fill="none" stroke="#fff" stroke-width="2"/>'},
"Pet care":{c:"#2A9D8F",i:'<circle cx="7" cy="9" r="2"/><circle cx="12" cy="7" r="2"/><circle cx="17" cy="9" r="2"/><path d="M7 17c0-3 2.5-5 5-5s5 2 5 5c0 2-2 2-5 2s-5 0-5-2z"/>'},
"Tutoring":{c:"#5E60CE",i:'<path d="M4 6h7v13H4zM13 6h7v13h-7z"/>'},

function chips(j){return `<div class="times">${j.shifts.slice(0,5).map(sh=>`<span>${sh.d} ${fmt(sh.s).replace(" ","")}–${fmt(sh.e).replace(" ","")}</span>`).join("")}${j.season==="summer"?'<span class="sum">Summer</span>':""}</div>`;}
function stepper(n){const st=["Profile","Matches","Apply","Hired"];return `<ol class="stepper" aria-label="Your progress">${st.map((x,i)=>`<li class="${i<n?"done":i===n?"now":""}">${x}</li>`).join("")}</ol>`;}

  </section>`;
}
function teenAge(){return parseInt(S.teen.age,10)||0;}
function matchJobs(){
  const age=teenAge();const out={fit:[],blocked:[],noTime:[]};
  S.jobs.filter(j=>j.verified).forEach(j=>{
    if(jobMiles(j)>S.teen.maxMiles) return;
    if(S.filters.cat!=="All"&&j.cat!==S.filters.cat) return;
    const issues=ruleCheck(age,j);
    if(issues.length){out.blocked.push({j,issues});return;}
    const overlap=j.shifts.filter(sh=>{const w=WINDOWS[S.teen.avail[sh.d]||"no"][1];return w&&sh.s>=w[0]&&sh.e<=w[1];});
    if(!overlap.length){out.noTime.push(j);return;}
    const why=[];
    const ds=[...new Set(overlap.map(o=>DAYNAME[o.d]))];
    why.push("Fits your "+listJoin(ds)+" free time");
    if(S.teen.interests.includes(j.cat)) why.push("matches your interest in "+j.cat.toLowerCase());
    out.fit.push({j,why:why.join(" and "),score:(S.teen.interests.includes(j.cat)?2:0)+overlap.length/j.shifts.length});
  });
  out.fit.sort((a,b)=>b.score-a.score||jobMiles(a.j)-jobMiles(b.j));
  return out;
}
function listJoin(a){if(a.length<2)return a.join("");return a.slice(0,-1).join(", ")+" and "+a[a.length-1];}
function schedText(j){
  const groups={};j.shifts.forEach(sh=>{const k=fmt(sh.s)+" to "+fmt(sh.e);(groups[k]=groups[k]||[]).push(DAYNAME[sh.d]);});
  return Object.entries(groups).map(([t,ds])=>listJoin(ds)+" "+t).join(". ")+(j.season==="summer"?" (summer)":"");
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

  app.innerHTML=fn();
  bind[S.role+"_"+v]&&bind[S.role+"_"+v]();
  save();
}

function teenJobs(){
  if(!S.teen.saved) return `<div class="card stack"><h2>Your matches show up here</h2><p>Save your profile first so we can check which jobs fit your age and schedule.</p><button class="btn" data-go="teen:profile">Build my profile</button></div>`;
  if(S.openJob) return jobDetail(S.jobs.find(j=>j.id===S.openJob));

  const a=S.apps.find(x=>x.id===S.openApp);
  const po=document.getElementById("parentOk");if(po)po.onclick=()=>{a.status="sent";render();toast("Approved. The employer can now see the application.");};
  app.querySelectorAll("[data-permit]").forEach(c=>c.onchange=()=>{a.permit[c.dataset.permit]=c.checked;render();});
  const rp=document.getElementById("report");if(rp)rp.onclick=reportDlg;
  const wd=document.getElementById("withdraw");if(wd)wd.onclick=()=>{if(confirm("Withdraw this application? The employer will no longer see it.")){S.apps=S.apps.filter(x=>x!==a);S.openApp=null;render();toast("Application withdrawn");}};
  if(a)bindThread(a,"teen");},
 biz_account(){goLinks();const f=document.getElementById("bf");
  if(f)f.onsubmit=e=>{e.preventDefault();const b=S.biz;b.name=document.getElementById("bn").value.trim();b.address=document.getElementById("ba").value.trim();b.contact=document.getElementById("bc").value.trim();b.email=document.getElementById("be").value.trim();
   const el=document.getElementById("bfErr");if(!b.name||!b.address||!b.contact){el.hidden=false;el.textContent="Add your business name, street address and contact person so we can verify you.";return;}
   b.status="pending";render();toast("Sent for verification");};
  const v=document.getElementById("verify");if(v)v.onclick=()=>{S.biz.status="verified";S.jobs.forEach(j=>{if(j.mine)j.verified=true;});render();toast("Business verified");};},
 biz_post(){goLinks();const f=document.getElementById("jf");if(!f)return;
  const read=()=>{const days=[...f.querySelectorAll('input[name=jd]:checked')].map(x=>x.value);
    return {hood:document.getElementById("jh").value,title:document.getElementById("jt").value.trim(),cat:document.getElementById("jc").value,pay:parseFloat(document.getElementById("jp").value)||0,minAge:parseInt(document.getElementById("jm").value),season:document.getElementById("js").value,shifts:days.map(d=>({d,s:parseFloat(f.querySelector(`[data-s=${d}]`).value),e:parseFloat(f.querySelector(`[data-e=${d}]`).value)})),duties:document.getElementById("jdu").value.split("\n").map(x=>x.trim()).filter(Boolean)};};
  const upd=()=>{const j=read();const rc=document.getElementById("rc");
    if(!j.shifts.length||j.shifts.some(x=>x.e<=x.s)){rc.innerHTML='<h3>Rule check</h3><p class="hint">Tick at least one day and make every end time later than its start time.</p>';return;}
    const groups=[[14,"Ages 14 and 15"],[16,"Ages 16 and 17"]].filter(([a])=>a===14?j.minAge<=15:true);
    rc.innerHTML='<h3>Rule check</h3><p class="hint">'+(j.season==="summer"?"Summer rules":"School year rules")+'. '+j.shifts.reduce((a,s)=>a+len(s),0)+' hours a week.</p>'+groups.map(([a,l])=>{const is=ruleCheck(Math.max(a,j.minAge),j);return is.length?`<div class="note bad"><strong>${l}: not allowed</strong><ul style="margin:.4em 0 0;padding-left:1.2em">${is.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`:`<div class="note ok"><strong>${l}: allowed</strong></div>`;}).join("")+'<p class="hint">Teens only see this job if the hours fit the rules for their age.</p>';};
  f.oninput=upd;f.onchange=upd;upd();
  f.onsubmit=e=>{e.preventDefault();const j=read();const el=document.getElementById("jfErr");const errs=[];
    if(!j.title)errs.push("Add a job title.");if(!j.shifts.length)errs.push("Pick at least one shift day.");if(j.pay<15)errs.push("Pay must be at least $15 per hour.");if(j.shifts.some(x=>x.e<=x.s))errs.push("Every end time must be later than its start time.");
    const anyOk=[14,15,16,17].filter(a=>a>=j.minAge).some(a=>!ruleCheck(a,j).length);if(!anyOk)errs.push("These hours break the rules for every age you picked. Shorten the shift or end it earlier.");
    if(errs.length){el.hidden=false;el.textContent=errs.join(" ");return;}
    Object.assign(j,{id:"m"+Date.now(),biz:S.biz.name,miles:1.0,mine:true,verified:S.biz.status==="verified"});if(!j.duties.length)j.duties=["Details shared at the interview"];
    S.jobs.unshift(j);toast(j.verified?"Job posted. Teens who fit can see it now.":"Job saved. It goes live after verification.");go("biz","applicants");};},
 biz_applicants(){goLinks();app.querySelectorAll("[data-bapp]").forEach(b=>b.onclick=()=>{S.openApp=b.dataset.bapp;render();});
  const bk=document.getElementById("backBiz");if(bk)bk.onclick=()=>{S.openApp=null;render();};
  const a=S.apps.find(x=>x.id===S.openApp);if(!a)return;
  const of=document.getElementById("offer");if(of)of.onclick=()=>{a.status="offer";render();toast("Job offered");};
  const dc=document.getElementById("decline");if(dc)dc.onclick=()=>{a.status="declined";render();toast("Applicant notified");};
  const pr=document.getElementById("promise");if(pr)pr.onchange=()=>{a.permit.e=pr.checked;render();};
  bindThread(a,"biz");},
 fb_form(){goLinks();document.getElementById("ff").onsubmit=e=>{e.preventDefault();const f=e.target;const g=n=>(f.querySelector(`input[name=${n}]:checked`)||{}).value;
   const $=id=>document.getElementById(id);const r={role:$("fr").value,age:$("fa").value,task:$("ft").value,done:g("done"),ease:g("ease"),trust:g("trust"),use:g("use"),liked:$("fl").value.trim(),confused:$("fc").value.trim(),want:$("fw").value.trim(),at:new Date().toISOString()};
   const el=document.getElementById("ffErr");if(!r.done||!r.ease||!r.trust||!r.use){el.hidden=false;el.textContent="Answer the task question and all three 1 to 5 questions before sending.";return;}
   S.feedback.push(r);save();if(SHEET_URL){try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(r)}).catch(()=>{});}catch(err){}}openDlg(`<h2>Thank you!</h2><p>Your feedback helps us improve the Teen Job Marketplace.</p><div class="row"><button class="btn" id="dOk">Done</button></div>`,()=>{document.getElementById("dOk").onclick=()=>{dlg.close();go("fb","form");};});};},
 fb_results(){goLinks();const s=document.getElementById("selAll");if(s)s.onclick=()=>{const t=document.getElementById("fbAll");t.focus();t.select();};
  const c=document.getElementById("clrFb");if(c)c.onclick=()=>{if(confirm("Delete all saved feedback on this device?")){S.feedback=[];render();}};}
};
render();
})();
</script>
